
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mostrador de Tabuadas</title>

    <style>
        #txtn1, #txtn2{
            width: 80px;
        }

        #principal{
            width: 500px;
            margin: 0 auto;
            text-align: center;
        }
        
        #botao{
            margin-top: 15px;
        }

        #resultado{
            margin-top: 20px;
        }
    </style>

</head>
<body>

    <div id="principal">
        <h1>Qual Tabuada Deseja Ver?</h1>

        <input type="number" name="txtn1" id="txtn1"> 
        
        <div id="botao">
            <button type="button" name="Calcular" id="calcular">Ver Tabuadas</button>
        </div>

        <div id="resultado"></div>

    </div>

    <script src="script.Tabuada.js"></script>
    
</body>
</html>
